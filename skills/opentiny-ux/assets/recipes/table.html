<section class="ux-section ux-stack"><h2>任务列表</h2><div class="ux-row"><label>搜索 <input id="table-search" class="ux-input" placeholder="输入任务名称"></label><button type="button" class="ux-btn" id="table-complete" disabled>批量完成</button><span id="table-count" role="status">已选择 0 项</span></div><div class="ux-table-wrap"><table class="ux-table"><thead><tr><th><input id="table-all" type="checkbox" aria-label="选择本页全部"></th><th aria-sort="none" id="table-name-head"><button type="button" class="ux-btn text" id="table-sort">任务名称 ↕</button></th><th>状态</th><th>负责人</th></tr></thead><tbody id="table-rows"></tbody></table></div><p class="ux-empty" id="table-empty" hidden>没有匹配任务，请调整搜索词。</p></section>
<script>(()=>{const q=s=>document.querySelector(s),rows=[{id:1,name:'需求评审',state:'待处理',owner:'张敏'},{id:2,name:'原型设计',state:'进行中',owner:'李阳'},{id:3,name:'可用性验证',state:'待处理',owner:'陈佳'}],selected=new Set();let direction=1,sort=false;const visible=()=>rows.filter(r=>r.name.includes(q('#table-search').value.trim())).sort((a,b)=>sort?direction*a.name.localeCompare(b.name,'zh-CN'):a.id-b.id);const sync=()=>{const list=visible();q('#table-complete').disabled=!selected.size;q('#table-count').textContent='已选择 '+selected.size+' 项';q('#table-all').checked=list.length>0&&list.every(r=>selected.has(r.id));q('#table-all').indeterminate=list.some(r=>selected.has(r.id))&&!q('#table-all').checked};const render=()=>{q('#table-rows').replaceChildren(...visible().map(r=>{const tr=document.createElement('tr'),td=document.createElement('td'),input=document.createElement('input');input.type='checkbox';input.checked=selected.has(r.id);input.setAttribute('aria-label','选择 '+r.name);input.onchange=()=>{input.checked?selected.add(r.id):selected.delete(r.id);sync()};td.append(input);tr.append(td);for(const value of [r.name,r.state,r.owner]){const cell=document.createElement('td');cell.textContent=value;tr.append(cell)}return tr}));q('#table-empty').hidden=visible().length>0;sync()};q('#table-search').oninput=()=>{selected.clear();render()};q('#table-sort').onclick=()=>{direction=sort?-direction:1;sort=true;q('#table-name-head').setAttribute('aria-sort',direction===1?'ascending':'descending');render()};q('#table-all').onchange=e=>{visible().forEach(r=>e.target.checked?selected.add(r.id):selected.delete(r.id));render()};q('#table-complete').onclick=()=>{rows.filter(r=>selected.has(r.id)).forEach(r=>r.state='已完成');selected.clear();render()};render()})();</script>
