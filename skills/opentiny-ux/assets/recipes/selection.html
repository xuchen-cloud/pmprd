<!-- Native fallbacks: select/datalist popup appearance follows the browser. For exact popup styling read the corresponding upstream theme. -->
<section class="ux-selection ux-section"><h2>人员与范围</h2><div class="ux-grid"><label class="ux-field">业务区域<select class="ux-input" id="sel-region"><option>华东</option><option>华南</option></select></label><label class="ux-field">城市<select class="ux-input" id="sel-city"></select></label><label class="ux-field">搜索成员<input class="ux-input" list="sel-people" placeholder="输入姓名"><datalist id="sel-people"><option value="张敏"><option value="李阳"><option value="陈佳"></datalist></label><label class="ux-field">完成比例 <output id="sel-percent">50%</output><input class="ux-range" id="sel-range" type="range" min="0" max="100" value="50"></label></div>
<details class="ux-tree-select"><summary>选择所属组织</summary><label><input type="radio" name="sel-org" value="product"> 产品部</label><label><input type="radio" name="sel-org" value="design"> 设计部</label></details>
<div class="ux-transfer"><section class="ux-transfer-panel"><h3>可选成员</h3><div class="ux-transfer-list" id="sel-left"><label><input type="checkbox" value="张敏">张敏</label><label><input type="checkbox" value="李阳">李阳</label><label><input type="checkbox" value="陈佳">陈佳</label></div></section><div class="ux-stack"><button type="button" class="ux-btn" id="sel-add" disabled>添加 →</button><button type="button" class="ux-btn" id="sel-remove" disabled>← 移除</button></div><section class="ux-transfer-panel"><h3>已选成员</h3><div class="ux-transfer-list" id="sel-right"></div></section></div><p id="sel-count" role="status">已选择 0 人</p></section>
<script>(()=>{const q=s=>document.querySelector(s),cities={'华东':['上海','杭州'],'华南':['广州','深圳']};const updateCity=()=>q('#sel-city').replaceChildren(...cities[q('#sel-region').value].map(x=>new Option(x,x)));q('#sel-region').onchange=updateCity;updateCity();q('#sel-range').oninput=e=>q('#sel-percent').textContent=e.target.value+'%';const sync=()=>{q('#sel-add').disabled=!q('#sel-left input:checked');q('#sel-remove').disabled=!q('#sel-right input:checked');q('#sel-count').textContent='已选择 '+q('#sel-right').children.length+' 人'};for(const [button,from,to] of [['sel-add','sel-left','sel-right'],['sel-remove','sel-right','sel-left']]){q('#'+button).onclick=()=>{q('#'+from).querySelectorAll('input:checked').forEach(input=>{input.checked=false;q('#'+to).append(input.parentElement)});sync()};q('#'+from).onchange=sync}})();</script>
