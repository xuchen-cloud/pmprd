<section class="ux-section ux-stack"><h2>状态与确认</h2><p class="ux-alert" role="status">草稿已保存，可继续编辑。</p><div id="feedback-item" class="ux-row ux-between"><span>待移除的附件</span><details class="ux-popover" id="feedback-confirm"><summary class="ux-btn">移除</summary><div class="ux-popover-panel align-end"><h3>移除附件？</h3><p>从当前草稿中移除此附件。</p><div class="ux-row"><button type="button" class="ux-btn small" id="feedback-cancel">取消</button><button type="button" class="ux-btn small primary" id="feedback-remove">移除</button></div></div></details></div><button type="button" class="ux-btn" id="feedback-notify">查看处理结果</button><aside class="ux-notify" id="feedback-result" role="status" hidden><div class="ux-row ux-between"><h3>处理完成</h3><button type="button" class="ux-btn text icon" id="feedback-close" aria-label="关闭通知">×</button></div><p>变更已保存到当前草稿。</p></aside></section>
<script>(()=>{const q=s=>document.querySelector(s);q('#feedback-cancel').onclick=()=>q('#feedback-confirm').open=false;q('#feedback-remove').onclick=()=>{q('#feedback-item').hidden=true;UX.toast('附件已移除')};q('#feedback-notify').onclick=()=>q('#feedback-result').hidden=false;q('#feedback-close').onclick=()=>q('#feedback-result').hidden=true;document.addEventListener('keydown',e=>{if(e.key==='Escape'&&q('#feedback-confirm').open){q('#feedback-confirm').open=false;q('#feedback-confirm summary').focus()}});document.addEventListener('click',e=>{if(!q('#feedback-confirm').contains(e.target))q('#feedback-confirm').open=false})})();</script>
