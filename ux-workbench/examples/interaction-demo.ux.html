<body>
  <main class="ux-page demo-page">
    <header class="demo-header">
      <h1>商品草稿</h1>
      <p class="ux-muted">填写商品名称，预览并保存草稿。</p>
    </header>
    <section class="ux-section">
      <h2>基本信息</h2>
      <form id="draftForm" class="ux-stack demo-form">
        <div class="ux-field">
          <label for="productName">商品名称 <span class="ux-required">*</span></label>
          <p id="nameHint" class="ux-hint">最多 80 字。</p>
          <input class="ux-input" id="productName" name="productName" data-ux-anchor="demo.product-name" value="DataPilot 智能数据分析平台" maxlength="80" required aria-describedby="nameHint">
        </div>
        <div class="ux-row demo-actions">
          <button class="ux-btn primary" id="saveDraft" data-ux-anchor="demo.save" type="submit">保存草稿</button>
          <button class="ux-btn" id="openPreview" data-ux-anchor="demo.preview" type="button">预览内容</button>
        </div>
        <p id="saveStatus" class="demo-status" role="status">尚未保存</p>
      </form>
    </section>
  </main>
  <dialog id="previewDialog" data-ux-anchor="demo.dialog" class="ux-dialog" aria-labelledby="previewTitle">
    <div class="ux-dialog-head"><h2 id="previewTitle">商品预览</h2></div>
    <div class="ux-dialog-body">
      <p id="previewName" class="preview-name"></p>
      <p class="ux-muted preview-hint">关闭预览后，可继续编辑商品名称。</p>
    </div>
    <form method="dialog" class="ux-dialog-foot"><button class="ux-btn primary" value="close" autofocus>关闭预览</button></form>
  </dialog>
  <script>
  (() => {
    const form = document.getElementById('draftForm');
    const name = document.getElementById('productName');
    const status = document.getElementById('saveStatus');
    const preview = document.getElementById('previewDialog');
    const storageKey = 'ux-review-interaction-demo-draft-v1';
    const valid = () => {
      name.setCustomValidity(name.value.trim() ? '' : '请填写商品名称');
      return form.reportValidity();
    };
    name.addEventListener('input', () => { name.setCustomValidity(''); status.textContent = '有未保存的修改'; });
    form.addEventListener('submit', event => {
      event.preventDefault();
      if (!valid()) return;
      const draft = { name: name.value.trim() };
      try { localStorage.setItem(storageKey, JSON.stringify(draft)); status.textContent = '已保存：' + draft.name; }
      catch { status.textContent = '本次会话已保存：' + draft.name + '（当前环境不支持本地存储）'; }
    });
    document.getElementById('openPreview').addEventListener('click', () => {
      if (!valid()) return;
      document.getElementById('previewName').textContent = name.value.trim();
      preview.showModal();
    });
    try {
      const saved = JSON.parse(localStorage.getItem(storageKey) || 'null');
      if (typeof saved?.name === 'string' && saved.name.trim() && saved.name.length <= 80) {
        name.value = saved.name; status.textContent = '已恢复草稿：' + saved.name;
      }
    } catch { /* The demo also works in a sandbox without persistent storage. */ }
  })();
  </script>
